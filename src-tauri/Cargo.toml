[package]
name = "mediapipe-desktop"
version = "0.1.0"
description = "Realtime MediaPipe hand and face tracking desktop application"
authors = ["you"]
edition = "2021"

[lib]
name = "mediapipe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
